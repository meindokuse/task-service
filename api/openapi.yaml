openapi: 3.0.3
info:
  title: Task Service API
  description: >
    REST API for team task management with RBAC, change history, and
    complex SQL reporting.
  version: "1.0.0"
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: teams
  - name: tasks
  - name: system

paths:
  /register:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /login:
    post:
      tags: [auth]
      summary: Log in and obtain a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams:
    post:
      tags: [teams]
      summary: Create a team (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [teams]
      summary: List teams the caller belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/stats:
    get:
      tags: [teams]
      summary: >
        Complex query (a): member count and 7-day completed task count per
        team (3-table JOIN with COUNT(DISTINCT ...)).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamStat"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}/invite:
    post:
      tags: [teams]
      summary: Invite a registered user to a team
      description: Owner/admin only.
      parameters:
        - $ref: "#/components/parameters/TeamIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Invitation processed (membership always created; email delivery best-effort)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/top-creators:
    get:
      tags: [teams]
      summary: >
        Complex query (b): top-3 task creators this month, per team (CTE +
        ROW_NUMBER() OVER (PARTITION BY team_id ...)).
      parameters:
        - $ref: "#/components/parameters/TeamIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopCreator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/orphaned-assignees:
    get:
      tags: [teams]
      summary: >
        Complex query (c): tasks whose assignee is not a member of the
        task's team (correlated NOT EXISTS subquery) — a data-integrity
        check intentionally not enforced on write.
      description: Owner/admin only.
      parameters:
        - $ref: "#/components/parameters/TeamIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrphanedTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks:
    post:
      tags: [tasks]
      summary: Create a task
      description: Team members only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [tasks]
      summary: List tasks for a team (cached in Redis, 5 min TTL)
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: integer
            format: uint64
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assignee_id
          in: query
          required: false
          schema:
            type: integer
            format: uint64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tasks/{id}:
    put:
      tags: [tasks]
      summary: Partially update a task
      description: >
        Creator, current assignee, or team owner/admin only. Changed fields
        are recorded to history atomically with the update; concurrent
        updates to the same task are serialized via a row-level lock
        (SELECT ... FOR UPDATE) so simultaneous edits cannot silently
        overwrite each other.
      parameters:
        - $ref: "#/components/parameters/TaskIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{id}/history:
    get:
      tags: [tasks]
      summary: Get the field-level change history of a task
      parameters:
        - $ref: "#/components/parameters/TaskIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskHistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{id}/comments:
    post:
      tags: [tasks]
      summary: Add a comment to a task
      parameters:
        - $ref: "#/components/parameters/TaskIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [tasks]
      summary: List comments on a task
      parameters:
        - $ref: "#/components/parameters/TaskIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /healthz:
    get:
      tags: [system]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtained from POST /login. Sent as "Authorization: Bearer <token>".
        Required on every route except /register, /login, /healthz, /metrics.

  parameters:
    TeamIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
    TaskIDPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64

  responses:
    BadRequest:
      description: Validation error (terror.KindValidation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing/invalid JWT (terror.KindUnauthorized)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Caller lacks permission for this resource (terror.KindForbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist (terror.KindNotFound)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicting state (terror.KindConflict)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CreatedID:
      type: object
      properties:
        id:
          type: integer
          format: uint64
      required: [id]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
      required: [email, password, name]

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: uint64
      required: [user_id]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user_id:
          type: integer
          format: uint64
      required: [token, user_id]

    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]

    Team:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        created_by:
          type: integer
          format: uint64
        created_at:
          type: string
          format: date-time

    TeamStat:
      type: object
      properties:
        team_id:
          type: integer
          format: uint64
        name:
          type: string
        member_count:
          type: integer
        done_last_7_days:
          type: integer

    TopCreator:
      type: object
      properties:
        user_id:
          type: integer
          format: uint64
        user_name:
          type: string
        tasks_count:
          type: integer
        rank:
          type: integer

    OrphanedTask:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        title:
          type: string
        assignee_id:
          type: integer
          format: uint64

    Role:
      type: string
      enum: [owner, admin, member]

    InviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
      required: [email]

    InviteResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: uint64
        email_delivered:
          type: boolean
          description: >
            False when the mock email gateway's circuit breaker was open or
            the send failed; membership is still created either way.
      required: [user_id, email_delivered]

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]

    CreateTaskRequest:
      type: object
      properties:
        team_id:
          type: integer
          format: uint64
        title:
          type: string
        description:
          type: string
        assignee_id:
          type: integer
          format: uint64
          nullable: true
      required: [team_id, title]

    Task:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        team_id:
          type: integer
          format: uint64
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        assignee_id:
          type: integer
          format: uint64
          nullable: true
        created_by:
          type: integer
          format: uint64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    UpdateTaskRequest:
      type: object
      description: >
        Partial update: omit a field to leave it unchanged. To clear the
        assignee explicitly, set "unassign": true (JSON cannot otherwise
        distinguish "field absent" from "field null").
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        assignee_id:
          type: integer
          format: uint64
          nullable: true
        unassign:
          type: boolean
          default: false

    TaskHistoryEntry:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        changed_by:
          type: integer
          format: uint64
        field:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        changed_at:
          type: string
          format: date-time

    AddCommentRequest:
      type: object
      properties:
        content:
          type: string
      required: [content]

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        user_id:
          type: integer
          format: uint64
        content:
          type: string
        created_at:
          type: string
          format: date-time
