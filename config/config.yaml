log_level: info

server:
  host: 0.0.0.0
  port: "8080"
  shutdown_timeout: 10s

mysql:
  host: mysql
  port: "3306"
  user: task_service
  password: task_service
  database: task_service
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: redis:6379
  password: ""
  db: 0

jwt:
  secret: change-me-in-production
  ttl: 24h

email:
  failure_rate: 0.2
  latency: 150ms
  breaker_max_requests: 3
  breaker_interval: 30s
  breaker_timeout: 15s
